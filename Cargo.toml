[package]
name = "opencode"
version = "0.3.0"
edition = "2021"
description = "OpenCode — local coding agent: ask, edit, scaffold, debug — backed by any OpenAI-compatible LLM (default Ollama + Llama 3 8B)"

[[bin]]
name = "opencode"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
ignore = "0.4"
similar = { version = "2", features = ["text", "inline"] }
toml = "0.8"
dirs = "5"
console = "0.15"
regex = "1"
rustyline = "14"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-go = "0.21"

[profile.release]
lto = true
codegen-units = 1
strip = true
